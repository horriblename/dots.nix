name: "Build Packages"
on:
  workflow_dispatch:
  push:
    paths:
      - "flake.lock"
jobs:
  build_packages:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            packages:
              - .#styluslabs-write
              - .#nvtopPackages.nvidia
              - .#llama-cpp
              - .#inputs.nvf.packages.aarch64-linux.default
              - .#inputs.hjem.packages.aarch64-linux.hjem
          - os: ubuntu-22.04-arm
            arch: arm64
            packages:
              - .#inputs.nvf.packages.x86_64-linux.default
              - .#inputs.hjem.packages.x86_64-linux.hjem
    steps:
      - uses: actions/checkout@v3
      - uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Set nix daemon tmpdir path
        run: |
          sudo mkdir -p /nix/tmpdir
          sudo chown "$(whoami)" /nix/tmpdir

          cat > override.conf <<EOF
          [Service]
          Environment="TMPDIR=/nix/tmpdir"
          EOF
          sudo mkdir /etc/systemd/system/nix-daemon.service.d/
          sudo mv override.conf /etc/systemd/system/nix-daemon.service.d/override.conf
          sudo systemctl daemon-reload
          sudo systemctl restart nix-daemon

      - uses: cachix/cachix-action@v12
        with:
          name: horriblename
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: |
          nix build --no-link --print-out-paths -L ${{ matrix.packages }} \
          | cachix push horriblename
